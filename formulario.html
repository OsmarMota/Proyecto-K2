<!DOCTYPE html>
<html lang="es">
 <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Christian Osmar Mota Dorantes">
    <meta name="description" content="Formulario registro K2">
    <link rel="stylesheet" href=".css">
    <title>Montañismo en el k2</title>
 </head>
 <body>
    <header>
      <h1>Formulario de Inscripción al K2</h1>
    </header>

    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="formulario.html">Formulario</a></li>
        <li><a href="acerca.html">Acerca de</a></li>
      </ul>
    </nav>

    <main>
      <form class="formulario">
         <label for="nombre">Nombre Completo:</label>
         <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre completo" required>

         <label>Género:</label>
         <label><input type="radio" name="genero" value="masculino">Masculino</label>
         <label><input type="radio" name="genero" value="femenino">Femenino</label>

         <label>Experiencia en Montañismo:</label>
         <label><input type="checkbox" name="experiencia" value="principiante">Principiante</label>
         <label><input type="checkbox" name="experiencia" value="intermedio">Intermedio</label>
         <label><input type="checkbox" name="experiencia" value="avanzado">Avanzado</label>

         <label for="pais">País de Residencia:</label>
         <select id="pais" name="pais" required>
           <option value="">Selecciona un país</option>
           <option value="mexico">México</option>
           <option value="espana">España</option>
           <option value="argentina">Argentina</option>
           <option value="otro">Otro</option>
         </select>

         <button type="submit">Enviar</button>
      </form>
    </main>

    <footer>
      &copy; 2025 Christian Osmar Mota Dorantes
    </footer>
 </body>
</html>
